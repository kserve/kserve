# This patch exposes manager metrics directly over unauthenticated HTTP.
# It is mutually exclusive with manager_auth_proxy_patch.yaml and does not
# configure controller-runtime SecureServing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-controller-manager
  namespace: kserve
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
    spec:
      containers:
      # Expose the prometheus metrics on default port
      - name: manager
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
