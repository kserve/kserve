# HTTPRoute template for LLMInferenceService routing.
#
# Each inference endpoint (completions, chat/completions, responses, messages,
# audio/speech, audio/transcriptions, images/generations)
# has a PathPrefix rule that matches /{namespace}/{name}/v1/... and rewrites
# to /v1/... through the InferencePool. Each PathPrefix rule carries a
# URLRewrite filter and must have exactly one match (Gateway API requirement
# for ReplacePrefixMatch).
#
# A single consolidated model-routing rule contains all header-based matches
# for every inference endpoint. These matches use exact paths (/v1/...) with
# the model-routing header (ModelBasedRoutingHeaderName), enabling shared-
# gateway deployments where a single gateway dispatches to multiple models by
# header value. No URLRewrite is needed since the path is already the target
# path. Because the rule has no filters, multiple matches can be ORed safely.
#
# The catch-all Service rules follow the same split: a PathPrefix rule with
# URLRewrite for path-based access, and a header-only rule for model-based routing.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-router-route
spec:
  router:
    route:
      http:
        spec:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: |-
                {{ .GlobalConfig.IngressGatewayName }}
              namespace: |-
                {{ .GlobalConfig.IngressGatewayNamespace }}
          rules:
            - name: v1-completions-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/completions
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/completions
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-chat-completions-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/chat/completions
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/chat/completions
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-responses-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/responses
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/responses
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-messages-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/messages
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/messages
              timeouts:
                backendRequest: 0s
                request: 0s
            # Modality endpoints served by vLLM-Omni (TTS + image generation).
            # Mirrors the llm-d diffusion-serving multi-endpoint HTTPRoute paths
            # with a 600s request timeout for long generations. Rules are grouped
            # by rewrite target (/v1/audio, /v1/images) instead of per-endpoint:
            # a rule carries a single ReplacePrefixMatch, and the preset must stay
            # within the Gateway API caps (16 rules, 8 matches per rule). Grouping
            # also forward-covers sibling paths (e.g. /v1/audio/speech/batch).
            # Publisher-qualified modality paths get their own grouped rules
            # below for the same reason.
            - name: v1-audio-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/audio
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/audio
              timeouts:
                backendRequest: 0s
                request: 600s
            - name: v1-images-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}/v1/images
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/images
              timeouts:
                backendRequest: 0s
                request: 600s
            - name: v1-model-routing
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: Exact
                    value: /v1/completions
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/completions/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/chat/completions
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/chat/completions/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/responses
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/responses/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/messages
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/messages/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/audio/speech
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/audio/speech/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/audio/transcriptions
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/audio/transcriptions/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/images/generations
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
                - path:
                    type: Exact
                    value: /v1/images/generations/
                  headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
              timeouts:
                backendRequest: 0s
                request: 0s
            # Publisher-qualified model paths provide a stable, version-independent
            # endpoint using spec.model.name instead of metadata.name.
            # The /publishers/ path prefix is reserved for this purpose.
            # These mirror the per-participant endpoint rules above.
            - name: v1-completions-publisher-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}/v1/completions
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/completions
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-chat-completions-publisher-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}/v1/chat/completions
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/chat/completions
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-responses-publisher-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}/v1/responses
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/responses
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-messages-publisher-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}/v1/messages
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/messages
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-audio-publisher-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}/v1/audio
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/audio
              timeouts:
                backendRequest: 0s
                request: 600s
            - name: v1-images-publisher-path
              backendRefs:
                - group: inference.networking.k8s.io
                  kind: InferencePool
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-inference-pool` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}/v1/images
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /v1/images
              timeouts:
                backendRequest: 0s
                request: 600s
            # Catch-all rules route to the workload Service directly (bypassing
            # InferencePool) for endpoints not handled by the scheduler, such as
            # /v1/models, /health, or custom paths exposed by the runtime. They
            # stay separate rules: a URLRewrite ReplacePrefixMatch rule admits
            # exactly one PathPrefix match.
            - name: v1-publisher-path-catch-all
              backendRefs:
                - kind: Service
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-kserve-workload-svc` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-catch-all-path
              backendRefs:
                - kind: Service
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-kserve-workload-svc` }}
                  port: 8000
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: |-
                      /{{ .ObjectMeta.Namespace }}/{{ .ObjectMeta.Name }}
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: /
              timeouts:
                backendRequest: 0s
                request: 0s
            - name: v1-catch-all-model-routing
              backendRefs:
                - kind: Service
                  name: |-
                    {{ ChildName .ObjectMeta.Name `-kserve-workload-svc` }}
                  port: 8000
                  weight: 1
              matches:
                - headers:
                    - type: Exact
                      name: "{{ .GlobalConfig.ModelBasedRoutingHeaderName }}"
                      value: publishers/{{ .ObjectMeta.Namespace }}/models/{{ .Spec.Model.Name }}
              timeouts:
                backendRequest: 0s
                request: 0s
