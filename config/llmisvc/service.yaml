apiVersion: v1
kind: Service
metadata:
  # Prometheus scrape target for llmisvc-controller metrics. Webhooks use
  # llmisvc-webhook-server-service instead.
  annotations:
    prometheus.io/port: "8443"
    prometheus.io/scheme: https
    prometheus.io/scrape: "true"
  name: llmisvc-controller-manager-service
  namespace: kserve
  labels:
    app.kubernetes.io/component: controller
    control-plane: llmisvc-controller-manager
    controller-tools.k8s.io: "1.0"
spec:
  selector:
    control-plane: llmisvc-controller-manager
    controller-tools.k8s.io: "1.0"
  ports:
  - port: 8443
    targetPort: metrics
    protocol: TCP
    name: https
