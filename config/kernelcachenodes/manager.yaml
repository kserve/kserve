apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kserve-kernelcachenode-agent
  namespace: kserve
  labels:
    app.kubernetes.io/name: kserve-kernelcachenode-agent
    control-plane: kserve-kernelcachenode-agent
spec:
  selector:
    matchLabels:
      control-plane: kserve-kernelcachenode-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kserve-kernelcachenode-agent
        control-plane: kserve-kernelcachenode-agent
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: serving.kserve.io/kernelcache-agent
                operator: In
                values:
                - disabled
      serviceAccountName: kserve-kernelcachenode-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        image: ko://github.com/kserve/kserve/cmd/kernelcachenode
        imagePullPolicy: IfNotPresent
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 128Mi
      terminationGracePeriodSeconds: 10
