[project]
authors = [
    {name = "The KServe Authors", email = "dsun20@bloomberg.net"},
    {name = "The KServe Authors", email = "fspolti@redhat.com"},
]
license = {text = "https://github.com/kserve/kserve/blob/master/LICENSE"}
requires-python = "<3.14,>=3.10"
dependencies = [
    # GHSA-6mq8-rvhq-8wgg, CVE-2025-69223 aiohttp HTTP parser auto_decompress zip bomb DoS
    "aiohttp<4.0.0,>=3.13.3",
    "certifi>=2024.7.4",
    "requests<3.0.0,>=2.32.2",
    "google-cloud-storage<3.0.0,>=2.14.0",
    "azure-storage-blob<13.0.0,>=12.20.0",
    "azure-storage-file-share<13.0.0,>=12.16.0",
    "azure-identity<2.0.0,>=1.15.0",
    "boto3<2.0.0,>=1.29.0",
    "huggingface-hub[hf-transfer]>=0.32.0",
    "hf-xet>=1.5.0",
    # Lightweight ModelScope download-only SDK (4 runtime deps), analogous to huggingface-hub.
    "modelscope-hub>=0.1.4",
    # CVE-2026-42563 Dulwich arbitrary code execution via malicious Git file paths during merge
    # CVE-2026-42305 Dulwich remote code execution via malicious Git repository (Windows path validation)
    "dulwich>=1.2.5",
    "oras<1.0.0,>=0.2.42",
    "cryptography>=48.0.1", # GHSA-537c-gmf6-5ccf, PYSEC-2026-36
    # CVE-2026-32597 PyJWT accepts unknown `crit` header extensions (RFC 7515 §4.1.11 MUST violation)
    # Pinning because it is a transitive dependency.
    "pyjwt>=2.12.0",
    # CVE-2026-30922 pyasn1 Vulnerable to Denial of Service via Unbounded Recursion
    # CVE-2026-59885 pyasn1 Quadratic complexity in OID processing allows DoS
    # Pinning because it is a transitive dependency.
    "pyasn1>=0.6.4",
    # CVE-2026-21226 Azure Core is vulnerable to deserialization of untrusted data
    # Pinning because it is a transitive dependency.
    "azure-core>=1.38.0",
    # GHSA-38jv-5279-wg99, CVE-2026-21441 urllib3 decompression-bomb bypass via HTTP redirects
    # Pinning because it is a transitive dependency.
    "urllib3>=2.6.3",

    # IBM Power (ppc64le)
    # add transitive dependencies as top-level dependency for uv to resolve it on ppc64le with explicit index
    "google-crc32c ; platform_machine == 'ppc64le'",
    "pyyaml ; platform_machine == 'ppc64le'",
]
name = "kserve-storage"
version = "0.21.0rc1"
readme = "README.md"
description = "KServe Storage Handler. This module is responsible to download the models from the provided source"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
confidential = ["jwcrypto>=1.5.0"]

[project.scripts]
kserve-decrypt = "kserve_storage.confidential.cli:main"

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'ppc64le'"]

[[tool.uv.index]]
name = "ibm-ppc64le"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux/+simple/"
explicit = true

[tool.uv.sources]
# IBM Power (ppc64le)
# Explicitly use the IBM index when resolving the following packages on ppc64le
google-crc32c = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
pyyaml = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
hf-xet = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
