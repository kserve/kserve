[project]
authors = [
    {name = "AnyISalIn", email = "anyisalin@gmail.com"},
]
license = {text = "Apache-2.0"}
requires-python = "<3.14,>=3.10"
dependencies = [
    "kserve @ file:///${PROJECT_ROOT}/../kserve",
    "kserve-storage @ file:///${PROJECT_ROOT}/../storage",
    "jpmml-evaluator~=0.10.3",
    "setuptools<71.0.0,>=70.0.0",

    # IBM
    "google-crc32c",
    "pyjnius",
    "jpype1",
    "hf-xet",
]
name = "pmmlserver"
version = "0.21.0"
description = "Model Server implementation for PMML. Not intended for use outside KServe Frameworks Images."
readme = "README.md"

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.4.4",
    "pytest-cov<6.0.0,>=5.0.0",
    "mypy<1.0,>=0.991",
    "pytest-asyncio<1.0.0,>=0.23.4",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",   # linux/amd64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",  # linux/arm64/v8
    "sys_platform == 'linux' and platform_machine == 'ppc64le'",  # linux/ppc64le
]

[[tool.uv.index]]
name = "ibm-ppc64le"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux/+simple/"
explicit = true

[tool.uv.sources]
google-crc32c = { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" }
pyjnius = { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le' and python_version != '3.13.*'" }
jpype1 = { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" }
hf-xet = { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" }
