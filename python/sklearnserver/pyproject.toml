[project]
authors = [
    {name = "singhan", email = "singhan@us.ibm.com"},
]
license = {text = "Apache-2.0"}
requires-python = "<3.14,>=3.10"
dependencies = [
    "kserve @ file:///${PROJECT_ROOT}/../kserve",
    "kserve-storage @ file:///${PROJECT_ROOT}/../storage",
    "scikit-learn~=1.5.1",
    "joblib<2.0.0,>=1.4.0",
    "pandas<3.0.0,>=2.2.0",

    # IBM Power (ppc64le)
    # add transitive dependencies as top-level dependency for uv to resolve it on ppc64le with explicit index
    "google-crc32c ; platform_machine == 'ppc64le'",
    "hf-xet ; platform_machine == 'ppc64le'",
    "scipy ; platform_machine == 'ppc64le'",
]
name = "sklearnserver"
version = "0.21.0rc1"
description = "Model Server implementation for scikit-learn. Not intended for use outside KServe Frameworks Images."
readme = "README.md"

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.2.0",
    "pytest-cov<5.0.0,>=4.0.0",
    "mypy<1.0,>=0.991",
    "pytest-asyncio<1.0.0,>=0.23.4",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'ppc64le'"]

[[tool.uv.index]]
name = "ibm-ppc64le"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux/+simple/"
explicit = true

[tool.uv.sources]
# IBM Power (ppc64le)
# Explicitly use the IBM index when resolving the following packages on ppc64le
pandas = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
google-crc32c = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
hf-xet = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
scikit-learn = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
scipy = {index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'"}
