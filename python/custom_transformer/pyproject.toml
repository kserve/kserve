[project]
authors = [
    {name = "Dan Sun", email = "dsun20@bloomberg.net"},
]
license = {text = "Apache-2.0"}
requires-python = "<3.14,>=3.10"
dependencies = [
    "kserve @ file:///${PROJECT_ROOT}/../kserve",
    "torchvision==0.26.0+cpu ; platform_machine != 'ppc64le'",
    "torchvision==0.26.0 ; platform_machine == 'ppc64le'",
    "torch==2.11.0+cpu ; platform_machine != 'ppc64le'",
    "torch==2.11.0 ; platform_machine == 'ppc64le'",
    "pillow>=12.3.0",
    "markupsafe",
]
name = "custom_transformer"
version = "0.21.0"
description = "Custom Transformer Examples. Not intended for use outside KServe Frameworks Images."

[dependency-groups]
test = [
    "pytest<8.0.0,>=7.4.4",
    "mypy<1.0,>=0.991",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]


[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",   # linux/amd64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",  # linux/arm64/v8
    "sys_platform == 'linux' and platform_machine == 'ppc64le'",  # linux/ppc64le
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_machine != 'ppc64le'" },
    { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_machine != 'ppc64le'" },
    { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" },
]
pillow = { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" }
markupsafe = { index = "ibm-ppc64le", marker = "platform_machine == 'ppc64le'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "ibm-ppc64le"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux/+simple/"
explicit = true
