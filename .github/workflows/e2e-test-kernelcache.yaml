name: KernelCache E2E Tests

on:
  pull_request:
    branches: [master, release*]
    paths:
      - "pkg/controller/v1alpha1/kernelcache*/**"
      - "pkg/webhook/admission/kernelcache/**"
      - "pkg/kernelcache/**"
      - "kernelcache/**"
      - "test/e2e/kernelcache/**"
      - "test/scripts/gh-actions/setup-kernelcache.sh"
      - ".github/workflows/e2e-test-kernelcache.yaml"
      - ".github/actions/**"
      - "charts/kserve-resources/**"
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: ${{ github.sha }}
  DOCKER_IMAGES_PATH: "/mnt/docker-images"
  KO_DOCKER_REPO: "kserve"
  BASE_ARTIFACT_PREFIX: "base"
  # In-cluster registry endpoint for KernelCache OCI artifacts
  KERNELCACHE_REGISTRY_ENDPOINT: "registry.kube-system.svc.cluster.local:80"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      install_methods: ${{ steps.set-matrix.outputs.install_methods }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Merge target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow origin
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git config user.email "ci@kserve.io"
          git config user.name "CI Bot"
          git merge --no-edit origin/${{ github.event.pull_request.base.ref }}
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            charts:
              - 'charts/**'
            non_charts:
              - '**'
              - '!charts/**'
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'install_methods=["kustomize","helm"]' >> $GITHUB_OUTPUT
          elif [[ "${{ steps.filter.outputs.charts }}" == "true" && \
                  "${{ steps.filter.outputs.non_charts }}" == "true" ]]; then
            echo 'install_methods=["kustomize","helm"]' >> $GITHUB_OUTPUT
          elif [[ "${{ steps.filter.outputs.charts }}" == "true" ]]; then
            echo 'install_methods=["helm"]' >> $GITHUB_OUTPUT
          else
            echo 'install_methods=["kustomize"]' >> $GITHUB_OUTPUT
          fi

  kserve-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Merge target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow origin
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git config user.email "ci@kserve.io"
          git config user.name "CI Bot"
          git merge --no-edit origin/${{ github.event.pull_request.base.ref }}

      - name: Load KServe environment variables
        run: ./kserve-images.sh --ci

      - name: Free-up disk space
        uses: ./.github/actions/free-up-disk-space

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cache-binary: true

      - name: Build KServe images
        run: |
          sudo mkdir -p ${DOCKER_IMAGES_PATH}
          sudo chown -R $USER ${DOCKER_IMAGES_PATH}
          ./test/scripts/gh-actions/build-images.sh
          docker image ls
          sudo ls -lh ${DOCKER_IMAGES_PATH}

      - name: Upload controller image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.CONTROLLER_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.CONTROLLER_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload localmodel controller image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.LOCALMODEL_CONTROLLER_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.LOCALMODEL_CONTROLLER_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload localmodel agent image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.LOCALMODEL_AGENT_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.LOCALMODEL_AGENT_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload agent image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.AGENT_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.AGENT_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload kernelcache node agent image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.KERNELCACHE_AGENT_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.KERNELCACHE_AGENT_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload storage initializer image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.STORAGE_INIT_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.STORAGE_INIT_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload router image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.ROUTER_IMG }}-${{ env.TAG }}
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.ROUTER_IMG }}-${{ env.TAG }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload MCV minimal image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BASE_ARTIFACT_PREFIX }}-${{ env.MCV_IMG }}-${{ env.TAG }}-minimal
          path: ${{ env.DOCKER_IMAGES_PATH }}/${{ env.MCV_IMG }}-${{ env.TAG }}-minimal
          compression-level: 0
          if-no-files-found: error

  test-kernelcache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [detect-changes, kserve-image-build]
    strategy:
      fail-fast: false
      matrix:
        install-method: ${{ fromJSON(needs.detect-changes.outputs.install_methods) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Merge target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --unshallow origin
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git config user.email "ci@kserve.io"
          git config user.name "CI Bot"
          git merge --no-edit origin/${{ github.event.pull_request.base.ref }}

      - name: Load KServe environment variables
        run: ./kserve-images.sh --ci

      - name: Free-up disk space
        uses: ./.github/actions/free-up-disk-space

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Create tmp-images directory
        run: |
          sudo mkdir -p /tmp-images
          sudo chown -R $USER /tmp-images

      - name: Setup Minikube
        uses: ./.github/actions/minikube-setup
        with:
          nodes: 3
          driver: "docker"
          addons: "registry"
          start-args: "--mount --mount-string=/tmp-images:/tmp-images"

      - name: Create minikube tunnel
        run: |
          nohup minikube tunnel > minikube-tunnel.log 2>&1 &

      - name: KServe dependency setup
        uses: ./.github/actions/kserve-dep-setup

      - name: Download KServe images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp-images
          pattern: ${{ env.BASE_ARTIFACT_PREFIX }}-*
          merge-multiple: true

      - name: Load KServe docker images onto all minikube nodes
        run: |
          ls -l /tmp-images
          minikube ssh -n minikube -- ls -l /tmp-images
          file_count=$(find /tmp-images -maxdepth 1 -type f | wc -l)
          if [[ "$file_count" -eq 0 ]]; then
            echo "::error::No image files found in /tmp-images"
            exit 1
          fi
          for file in $(find /tmp-images -maxdepth 1 -type f); do
            echo "Loading image $(basename "$file")"
            minikube ssh -n minikube -- docker image load -i "$file"
            minikube ssh -n minikube-m02 -- docker image load -i "$file"
            minikube ssh -n minikube-m03 -- docker image load -i "$file"
          done
          sudo rm -rf /tmp-images/*
          expected_images=(
            "${KO_DOCKER_REPO}/${CONTROLLER_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${LOCALMODEL_CONTROLLER_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${LOCALMODEL_AGENT_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${KERNELCACHE_AGENT_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${AGENT_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${STORAGE_INIT_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${ROUTER_IMG}:${TAG}"
            "${KO_DOCKER_REPO}/${MCV_IMG}:${TAG}-minimal"
          )
          for node in minikube minikube-m02 minikube-m03; do
            for img in "${expected_images[@]}"; do
              if ! minikube ssh -n "$node" -- docker image inspect "$img" > /dev/null 2>&1; then
                echo "::error::Image $img not found on node $node"
                exit 1
              fi
            done
          done
          echo "All images verified on all nodes"

      - name: Configure containerd insecure registry on all nodes
        run: |
          # Fix two issues with the in-cluster minikube registry addon that
          # prevent prefetch jobs from pulling artifacts from the registry:
          #
          # 1. DNS: minikube nodes use the Docker bridge (192.168.49.1) as their
          #    resolver and cannot resolve cluster-internal names such as
          #    registry.kube-system.svc.cluster.local. Add the ClusterIP to /etc/hosts.
          #
          # 2. HTTPS: containerd defaults to HTTPS for non-localhost registries.
          #    Write a certs.d/hosts.toml entry to allow plain HTTP.
          #
          # We use `docker exec` rather than `minikube ssh` because the minikube
          # container directories carry the container_file_t SELinux label, which
          # blocks file creation via sudo from SSH sessions but not from inside
          # the container itself.
          kubectl wait --for=condition=Available deployment/registry -n kube-system --timeout=120s
          REGISTRY_IP=$(kubectl get svc registry -n kube-system -o jsonpath='{.spec.clusterIP}')
          REGISTRY_HOSTNAME="registry.kube-system.svc.cluster.local"
          REGISTRY_ENDPOINT="${REGISTRY_HOSTNAME}:80"
          for NODE in minikube minikube-m02 minikube-m03; do
            echo "Configuring ${NODE} ..."
            docker exec "${NODE}" bash -c \
              "grep -q '${REGISTRY_HOSTNAME}' /etc/hosts || echo '${REGISTRY_IP} ${REGISTRY_HOSTNAME}' >> /etc/hosts"
            docker exec "${NODE}" mkdir -p "/etc/containerd/certs.d/${REGISTRY_ENDPOINT}"
            docker exec "${NODE}" bash -c "cat > /etc/containerd/certs.d/${REGISTRY_ENDPOINT}/hosts.toml << 'TOML'
          server = \"http://${REGISTRY_ENDPOINT}\"
          [host.\"http://${REGISTRY_ENDPOINT}\"]
            capabilities = [\"pull\", \"resolve\", \"push\"]
            skip_verify = true
          TOML"
          done

      - name: Install UV
        run: ./test/scripts/gh-actions/setup-uv.sh

      - name: Install KServe
        run: |
          ${{ matrix.install-method == 'helm' && 'export INSTALL_METHOD="helm"' || '' }}
          export SET_KSERVE_VERSION=${{ env.TAG }}
          ./test/scripts/gh-actions/setup-kserve.sh
          kubectl get pods -n kserve
          kubectl describe pods -n kserve
          kubectl describe configmaps -n kserve inferenceservice-config

      - name: Patch kernelcache node agent DaemonSet image pull policy
        run: |
          # The DaemonSet uses the locally built image loaded onto each node.
          # Set imagePullPolicy to IfNotPresent so containerd uses the cached
          # image rather than attempting a pull from an external registry.
          kubectl patch daemonset -n kserve kserve-kernelcachenode-agent \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"manager","imagePullPolicy":"IfNotPresent"}]}}}}'

      - name: Setup KernelCache
        run: |
          ./test/scripts/gh-actions/setup-kernelcache.sh
          kubectl get pods -n kserve

      - name: Run E2E tests
        timeout-minutes: 25
        run: |
          # Set MCV image to the CI-built version for test fixtures
          export KERNELCACHE_MCV_IMAGE="${KO_DOCKER_REPO}/${MCV_IMG}:${TAG}-minimal"
          ./test/scripts/gh-actions/run-e2e-tests.sh "kernelcache" "1"

      - name: Check system status
        if: always()
        run: |
          echo "::group::Minikube tunnel logs"
          cat minikube-tunnel.log 2>/dev/null || echo "No minikube tunnel log found"
          echo "::endgroup::"
          ./test/scripts/gh-actions/status-check.sh

      - name: Upload test results
        if: always()
        uses: ./.github/actions/upload-test-results
        with:
          name: test-results-kernelcache-${{ matrix.install-method }}
