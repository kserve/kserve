name: "Precommit Check"

on:
  # Push runs check the latest master commit and keep the Go cache below warm
  # for PR runs; a burst of merges coalesces into one run for its last commit.
  # Merges by github-actions[bot] start no push runs, so a dependency bump the
  # bot merges is picked up by the next human merge.
  #
  # Covers every event go.yml runs on: Go Test skips fmt, vet and manifests
  # (make test-only) and relies on this workflow for them.
  push:
    branches: [master, release*]
  pull_request:
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

# make check runs third-party tooling (pip, uv, go install, apt), so it gets no
# write access to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled master run saves nothing, so only PR and merge queue runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  precommit-check:
    runs-on: ubuntu-latest
    # A master run that misses the cache builds from scratch and then saves ~2GB.
    timeout-minutes: 30
    env:
      SAVES_GO_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Merge target branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --unshallow origin
          git fetch origin "$BASE_REF"
          git config user.email "ci@kserve.io"
          git config user.name "CI Bot"
          git merge --no-edit "origin/$BASE_REF"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # setup-go keys its cache on OS, Go version and go.sum only, so every
          # workflow using it shares one key and the first job to finish wins
          # it - usually go-license-check, which compiles next to nothing.
          cache: false

      # Tools are go-installed at the versions pinned in kserve-deps.env, outside
      # go.sum. golangci-lint keys its cache on its config and the CPU count, and
      # cgo entries depend on the runner image, so all of these go into the key.
      - name: Go cache key
        id: key
        run: |
          echo "image=${ImageOS:-unknown}-$(nproc)cpu" >> "$GITHUB_OUTPUT"
          echo "tools=$(grep -E '^(GOLANGCI_LINT|CONTROLLER_TOOLS|HELM_DOCS)_VERSION=' kserve-deps.env | cat - .golangci.yml | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Module, build and golangci-lint caches for `make check`, under a key
      # no other workflow uses. The key moves with the dependency set (go.mod,
      # go.sum, Go version, tools), not with kserve's own code: Go matches
      # build entries by content, so changed packages recompile on top of it.
      #
      # Only master push runs save it (SAVES_GO_CACHE). PR, merge queue,
      # release branch and manual runs restore the master entry and never
      # save: their entries are visible to that one ref and would only eat
      # into the 10GB cache quota.
      #
      # It also means the entry PR runs restore was built from merged code.
      # GitHub scopes a PR run's saves to its merge ref, and gives
      # pull_request_target, issue_comment and workflow_run jobs a read-only
      # cache. Keep it that way:
      # - never save this cache from runs other than master pushes
      # - never set cache-mode: write, and never run code that is not on master
      #   from a trigger that writes master's cache
      # - never restore this key in workflows that build or publish releases
      #
      # Go and golangci-lint trust what is already in these caches (Go checks
      # go.sum against the cached .ziphash, not the files), and entries are
      # immutable, so a bad entry stays until the key changes.
      # To drop one: gh cache list -R kserve/kserve --key precommit-go-, then
      # gh cache delete -R kserve/kserve <key>; the next master run rebuilds it.
      #
      # go.yml restores this entry too. Keep its `path` list identical to this
      # one, or it silently misses and builds from scratch.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: precommit-go-${{ runner.os }}-${{ steps.key.outputs.image }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'qpext/go.mod', 'qpext/go.sum', 'kernelcache/mcv/go.mod', 'kernelcache/mcv/go.sum') }}-${{ steps.key.outputs.tools }}
          # Runs that don't save fall back to the newest master entry when the
          # dependency set differs. Master builds each entry from scratch, so
          # modules dropped from go.sum don't pile up in it.
          restore-keys: ${{ env.SAVES_GO_CACHE != 'true' && format('precommit-go-{0}-{1}-{2}-', runner.os, steps.key.outputs.image, steps.setup-go.outputs.go-version) || '' }}

      # Go and golangci-lint delete entries unused for 5 days, at most once a
      # day, going by file mtimes, which the restore keeps from the day master
      # saved the entry. Recording a trim now stops the first go command from
      # thinning out an entry older than that.
      - name: Keep the restored Go cache whole
        run: |
          for dir in ~/.cache/go-build ~/.cache/golangci-lint; do
            mkdir -p "$dir" && date +%s > "$dir/trim.txt"
          done

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
            python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgpgme-dev \
            libbtrfs-dev \
            build-essential \
            pkg-config \
            libassuan-dev \
            libgpg-error-dev

      - name: Install dependencies
        run: |
          go mod download
          (cd qpext && go mod download)
          (cd kernelcache/mcv && go mod download)

      - name: Cache openapi-generator JAR
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: hack/python-sdk/openapi-generator-cli-*.jar
          key: openapi-generator-${{ hashFiles('hack/python-sdk/client-gen.sh') }}

      - name: Check
        shell: bash
        run: |
          make check

      # Entries are immutable, so an exact hit means there is nothing to save.
      # A failed check saves nothing either, so a half-built cache never takes
      # the key.
      - name: Save Go cache
        if: env.SAVES_GO_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
