# Apply /kind labels from the issue body when an issue is opened.

name: "Issue body kind label"
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  kind-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;

            // Lines that start with "/kind", e.g. "/kind bug" or "/kind bug feature".
            const body = context.payload.issue.body || '';
            const kinds = body.split('\n')
              .filter(line => line.trim().startsWith('/kind '))
              .flatMap(line => line.trim().split(/\s+/).slice(1));

            // Only labels that already exist in the repo; addLabels would create missing ones.
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const names = new Set(existing.map(l => l.name));
            const labels = [...new Set(kinds)].map(k => `kind/${k}`).filter(l => names.has(l));
            if (labels.length === 0) {
              core.info('No known /kind label in the issue body, nothing to label.');
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              labels,
            });
            core.info(`Added labels: ${labels.join(', ')}`);
