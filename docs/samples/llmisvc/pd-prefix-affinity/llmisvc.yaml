apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen-pd-prefix
  namespace: llmisvc-prefix-demo
spec:
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: Qwen/Qwen3-0.6B
  storageInitializer:
    enabled: false
  # decode
  replicas: 2
  rolloutStrategy: {maxSurge: 1, maxUnavailable: 0}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim@sha256:d0a1a8301e57a8a5a776339e9dd72cb92b342ba6471d0dd2088994d3a1e435c4
        command: [/app/llm-d-inference-sim]
        args:
          - --port=8001
          - --model=Qwen/Qwen3-0.6B
          - --mode=echo
          - --max-model-len=32768
          - --time-to-first-token=20ms
          - --inter-token-latency=5ms
        env:
          - {name: RELEASE, value: r0}
          - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
          - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 256Mi}
  prefill:
    replicas: 2
    rolloutStrategy: {maxSurge: 1, maxUnavailable: 0}
    template:
      containers:
        - name: main
          image: ghcr.io/llm-d/llm-d-inference-sim@sha256:d0a1a8301e57a8a5a776339e9dd72cb92b342ba6471d0dd2088994d3a1e435c4
          command: [/app/llm-d-inference-sim]
          args:
            - --port=8000
            - --model=Qwen/Qwen3-0.6B
            - --mode=echo
            - --max-model-len=32768
            - --time-to-first-token=20ms
            - --inter-token-latency=5ms
          env:
            - {name: RELEASE, value: r0}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
  router:
    gateway:
      refs:
        - name: prefix-rollout
          namespace: llmisvc-prefix-demo
    route: {}
    scheduler:
      template:
        containers:
          - name: main
            image: ghcr.io/llm-d/llm-d-router-endpoint-picker@sha256:6176aa2c9909a1a9d910878bfb45df51ac858d1b1d7baeb3b7c9b764f05b79f3
            args:
              - --allow-experimental-plugins
      config:
        inline:
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: disaggregatedset-rollout-screener
              parameters:
                scope:
                  labelSelector: "app.kubernetes.io/name=qwen-pd-prefix"
                revisionGating:
                  mode: max-role
                  requiredRoles: [prefill, decode]
                  disableCoordination: true
                  affinity:
                    mode: prefix
            - type: always-disagg-pd-decider
            - type: disagg-profile-handler
              parameters:
                deciders:
                  prefill: always-disagg-pd-decider
            - type: prefill-filter
            - type: decode-filter
            - type: approx-prefix-cache-producer
            - type: inflight-load-producer
            - type: token-load-scorer
            - type: active-request-scorer
            - type: max-score-picker
          schedulingProfiles:
            - name: prefill
              plugins:
                - pluginRef: prefill-filter
                - pluginRef: token-load-scorer
                - pluginRef: max-score-picker
            - name: decode
              plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                - pluginRef: max-score-picker
  annotations:
    serving.kserve.io/enable-disaggregated-set: "true"
