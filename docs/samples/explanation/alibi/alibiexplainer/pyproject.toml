[project]
name = "alibiexplainer"
version = "0.21.0"
description = "Model Explanation Server. Not intended for use outside KServe Frameworks Images."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "cliveseldon", email = "cc@seldon.io" }]
dependencies = [
    "kserve",
    "kserve-storage",
    # From 0.9.5 alibi uses BSL license (removed tensorflow extra for newer tensorflow stacks)
    "alibi[shap]>=0.9.4,<0.10",
    "tensorflow>=2.15",
    "dill>=0.3.8,<0.4",
    "nest-asyncio>=1.4.0,<1.5",
    # needed since resolvers may pick an older llvmlite not supported on newer Python
    "llvmlite>0.38.1",
    "tensorflow-io-gcs-filesystem==0.37.1; python_full_version < '3.13'",
    "keras>=3.12.0",
    "urllib3>=2.6.0",
    "transformers>=4.53.0",
]

[project.urls]
repository = "https://github.com/kserve/kserve/tree/master/docs/samples/explanation/alibi/alibiexplainer"

[dependency-groups]
test = [
    "pytest>=7.2.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "mypy>=0.991,<1.0",
]
dev = [
    "black[colorama]>=26.3.1,<27",
]

[tool.uv]
override-dependencies = [
    # Force pillow>=12.3.0 to address CVE-2026-59200 (GHSA-jjj6-mw9f-p565).
    # alibi<0.10 declares pillow<11.0, but this override allows resolving to
    # the patched version. alibi's Pillow usage is compatible with 12.x.
    "pillow>=12.3.0",
    # alibi<0.10 pins old numpy/numba/shap/spacy stacks that have no wheels for newer
    # Python versions and conflict with TensorFlow>=2.19 (ml-dtypes>=0.5.1 needs numpy>=2.1 on 3.13).
    # Keep the numpy 1.x stack on Python <3.13 and use numpy 2.x on 3.13.
    "numpy>=1.26.0,<2.0; python_full_version < '3.13'",
    "numpy>=2.1.0,<3.0; python_full_version >= '3.13'",
    "numba>=0.59.0,<0.60; python_full_version < '3.13'",
    "numba>=0.61.0; python_full_version >= '3.13'",
    "llvmlite>=0.42.0,<0.43; python_full_version < '3.13'",
    "llvmlite>=0.44.0; python_full_version >= '3.13'",
    "shap>=0.45.0",
    "spacy>=3.8.7; python_full_version >= '3.13'",
    "thinc>=8.3.4; python_full_version >= '3.13'",
    "blis>=1.2.0; python_full_version >= '3.13'",
    "scikit-image>=0.25.0; python_full_version >= '3.13'",
]

[tool.uv.sources]
kserve = { path = "../../../../../python/kserve", editable = true }
kserve-storage = { path = "../../../../../python/storage", editable = true }

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alibiexplainer"]
