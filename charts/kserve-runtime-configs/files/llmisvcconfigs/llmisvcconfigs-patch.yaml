{{- if .Values.kserve.llmisvcConfigs.enabled }}
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-decode-template
spec:
  template:
    containers:
      - name: pvc-evictor
        image: "{{ include "kserve-runtime-configs.image" (dict "image" .Values.kserve.llmd.kvCacheEvictor.image "tag" .Values.kserve.llmd.kvCacheEvictor.tag) }}"
      - name: main
        image: "{{ include "kserve-runtime-configs.image" (dict "image" .Values.kserve.llmd.llmdCuda.image "tag" .Values.kserve.llmd.llmdCuda.tag) }}"
    initContainers:
      - name: llm-d-routing-sidecar
        image: "{{ include "kserve-runtime-configs.image" (dict "image" .Values.kserve.llmd.llmdRouterDisaggSidecar.image "tag" .Values.kserve.llmd.llmdRouterDisaggSidecar.tag) }}"

---
