kserve:
  localmodel:
    controller:
      image: kserve/kserve-localmodel-controller
      # -- Additional container arguments. Example: ["--log-format=otel-json"].
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
  localmodelnode:
    controller:
      image: kserve/kserve-localmodelnode-agent
      # -- Additional container arguments. Example: ["--log-format=otel-json"].
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
      nodeSelector:
        kserve/localmodel: worker
      affinity: {}
      tolerations: []  
  kernelcachenode:
    controller:
      image: kserve/kserve-kernelcachenode-agent
      # -- Additional container arguments.
      extraArgs: []
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 10m
          memory: 128Mi
      affinity: {}
      tolerations: []