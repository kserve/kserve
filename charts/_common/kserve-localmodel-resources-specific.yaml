kserve:
  localmodel:
    controller:
      image: kserve/kserve-localmodel-controller
      # -- Log output format. One of zap or otel-json.
      logFormat: zap
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
  localmodelnode:
    controller:
      image: kserve/kserve-localmodelnode-agent
      # -- Log output format. One of zap or otel-json.
      logFormat: zap
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 100m
          memory: 200Mi
      nodeSelector:
        kserve/localmodel: worker
      affinity: {}
      tolerations: []  
  kernelcachenode:
    controller:
      image: kserve/kserve-kernelcachenode-agent
      tag: ''
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 300Mi
        requests:
          cpu: 10m
          memory: 128Mi
      affinity: {}
      tolerations: []