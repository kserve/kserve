              trigger:
                default: false
                description: Trigger initiates the cache capture when set to true
                type: boolean
              volumeStrategy:
                default: shared
                description: |-
                  VolumeStrategy specifies how to access the cache
                  shared: inject shared emptyDir volume (default)
                  copy: use kubectl cp to copy cache from main container
                enum:
                - shared
                - copy
                type: string
            required:
