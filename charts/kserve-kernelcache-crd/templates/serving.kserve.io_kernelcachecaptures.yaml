              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KernelCacheCaptureSpec defines the desired state of KernelCacheCapture
            properties:
              cachePath:
                description: |-
                  CachePath specifies an explicit cache directory path
                  Overrides CachePreset if both are specified
                type: string
              cachePreset:
                description: |-
                  CachePreset specifies a known cache location preset (vllm, tgi, triton-python)
                  Mutually exclusive with CachePath
                enum:
                - vllm
                - tgi
                - triton-python
                type: string
              createKernelCache:
                description: CreateKernelCache controls auto-creation of KernelCache
                  CR
                properties:
                  enabled:
                    default: true
                    description: Enabled controls whether to auto-create KernelCache
                    type: boolean
                  mountType:
                    default: imageVolume
                    description: MountType for the auto-created KernelCache
                    enum:
                    - pvc
                    - imageVolume
                    type: string
                  name:
                    description: Name for the auto-created KernelCache (defaults to
                      KCC name)
                    type: string
                  pullSecretRef:
                    description: PullSecretRef for pulling the captured image (can
                      differ from push secret)
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
