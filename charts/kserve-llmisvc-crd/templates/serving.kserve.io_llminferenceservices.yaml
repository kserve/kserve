{{- /* The CRD manifest in files/ is kustomize output regenerated by `make
       generate-manifests` and must stay free of Helm templating; chart-level
       transforms happen here at render time instead (same pattern as
       templates/llmisvc/resources.yaml in kserve-llmisvc-resources). */ -}}
{{- $raw := .Files.Get "files/serving.kserve.io_llminferenceservices.yaml" -}}
{{- $selfSignedCfg := include "kserve-llmisvc-crd.selfSignedCertsConfig" . | fromJson -}}
{{- if not $selfSignedCfg.enabled -}}
{{ $raw }}
{{- else -}}
{{- /* selfSignedCerts mode: without cert-manager's CA injector the
       inject-ca-from annotation is inert, so drop it and embed the CA
       directly as the conversion-webhook caBundle. */ -}}
{{- $crd := fromYaml $raw -}}
{{- $_ := unset $crd.metadata.annotations "cert-manager.io/inject-ca-from" -}}
{{- $ca := include "kserve-llmisvc-crd.selfSignedCA" . | fromJson -}}
{{- $_ := set $crd.spec.conversion.webhook.clientConfig "caBundle" ($ca.Cert | b64enc) -}}
{{ toYaml $crd }}
{{- end }}
